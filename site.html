<title>Trois propositions Jamet</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=Karla:wght@500;600;700&family=Spectral:ital,wght@0,400;0,600;0,700;1,400&family=Syne:wght@600;700;800&family=Syne+Mono&display=swap">
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:#111}
button{font:inherit}
img{max-width:100%;display:block}

/* ---------- barre de test ---------- */
.testbar{position:fixed;top:0;left:0;right:0;z-index:99;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:9px 18px;background:#101113;color:#C8CCD0;font-family:'Archivo',Arial,sans-serif;font-size:12px;
  letter-spacing:.04em;border-bottom:1px solid #26292D}
.testbar b{color:#fff;font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:10.5px}
.tb{display:flex;border:1px solid #33373C;border-radius:2px;overflow:hidden}
.tb button{background:none;border:0;border-right:1px solid #33373C;color:#C8CCD0;padding:6px 13px;cursor:pointer}
.tb button:last-child{border-right:0}
.tb button[aria-pressed="true"]{background:#E9EDF1;color:#101113;font-weight:600}
.tb .note{color:#7C838B;margin-left:auto}
#app{padding-top:var(--tbh,38px)}

/* ---------- socle ---------- */
.site{min-height:100vh;background:var(--ground);color:var(--ink);font-family:var(--fb);font-size:var(--fs);line-height:1.55}
.site a{color:var(--acc);text-decoration:none}
.site a.btn,.site .btn{color:var(--accfg)}
.site a.btn2,.site .btn2{color:var(--ink)}
.site .band a,.site .band .btn{color:inherit}
.site a:hover{opacity:.75}
.wrap{max-width:1240px;margin:0 auto;padding:0 40px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:18px 0;border-bottom:1px solid var(--rule)}
.hd nav{display:flex;gap:24px;flex-wrap:wrap}
.hd nav a{color:var(--ink);font-size:14px;font-weight:500}
.hd nav a.on{color:var(--acc)}
.mark{font-family:var(--fd);font-weight:var(--fdw);font-size:21px;letter-spacing:var(--fdls);text-transform:var(--fdtt);line-height:1.05}
.tel{font-family:var(--fm);font-size:16px;font-weight:600;white-space:nowrap}
h1,h2,h3{font-family:var(--fd);font-weight:var(--fdw);letter-spacing:var(--fdls);line-height:1.02;margin:0;text-wrap:balance}
h1{font-size:var(--h1);text-transform:var(--fdtt)}
h2{font-size:var(--h2);text-transform:var(--fdtt)}
h3{font-size:22px}
p{margin:0;line-height:1.6}
.lead{font-size:19px;color:var(--ink2);max-width:40em}
.lab{font-family:var(--fl);font-weight:600;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink2)}
.ref{font-family:var(--fm);font-size:11px;letter-spacing:.05em;color:var(--acc)}
.sec{padding:64px 0;border-top:1px solid var(--rule)}
.cols{display:grid;gap:52px}.cols>*{min-width:0}
@media(min-width:920px){.cols.c2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
 .cols.c21{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}
 .cols.c12{grid-template-columns:minmax(0,1fr) minmax(0,1.15fr)}}
.stack{display:flex;flex-direction:column;gap:20px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.hr{height:1px;background:var(--rule)}
.btn{display:inline-flex;align-items:center;gap:10px;background:var(--acc);color:var(--accfg);border:0;
  border-radius:var(--rad);padding:16px 26px;cursor:pointer;font-family:var(--fb);font-weight:700;
  font-size:var(--btnfs);letter-spacing:var(--btnls);text-transform:var(--btntt)}
.btn2{display:inline-flex;align-items:center;gap:10px;background:none;color:var(--ink);border:1px solid var(--btnb);
  border-radius:var(--rad);padding:15px 25px;cursor:pointer;font-family:var(--fb);font-weight:600;
  font-size:var(--btnfs);letter-spacing:var(--btnls);text-transform:var(--btntt)}
.plate{position:relative;background:var(--panel);border:1px solid var(--rule);border-radius:var(--rad)}
.imgbox{background:var(--imgbg);border-radius:var(--rad);overflow:hidden;display:flex;align-items:center;justify-content:center}
.imgbox img{width:100%;height:100%;object-fit:cover}
.grid3{display:grid;gap:var(--gap);grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.mcard{display:flex;flex-direction:column;text-align:left;background:var(--cardbg);border:var(--cardbd);
  border-radius:var(--rad);overflow:hidden;cursor:pointer;color:inherit}
.mcard:hover{border-color:var(--acc)}
.mcard .mimg{background:var(--imgbg);aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;padding:14px}
.mcard .mimg img{width:auto;height:100%;object-fit:contain}
.mcard .mtxt{padding:var(--cardpad);display:flex;flex-direction:column;gap:8px}
.mcard h3{font-size:var(--cardh)}
.mcard p{font-size:15.5px;color:var(--ink2)}
.tbl{display:flex;flex-direction:column}
.tbl div{display:flex;justify-content:space-between;gap:20px;padding:13px 0;border-top:1px solid var(--rule)}
.tbl div:last-child{border-bottom:1px solid var(--rule)}
.tbl span:first-child{font-size:16.5px}
.band{position:relative;background:var(--brand);color:var(--brandfg);padding:44px;border-radius:var(--rad)}
.band.keyline::after{content:'';position:absolute;inset:11px;border:2px solid var(--brandfg);opacity:.5;pointer-events:none}
.chips{display:flex;flex-wrap:wrap;gap:9px}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--rule);border-radius:var(--chiprad);
  padding:7px 13px;font-size:12.5px;font-weight:500;white-space:nowrap}
.chip i{width:5px;height:5px;border-radius:50%;background:var(--acc);display:block}
.foot{border-top:1px solid var(--rule);padding:34px 0 48px;display:flex;justify-content:space-between;gap:30px;flex-wrap:wrap;align-items:flex-end}
.cap{font-style:italic;font-size:14.5px;color:var(--ink2)}

/* ---------- module 1 ---------- */
.extr{position:relative}
.extr .in{display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:44px;align-items:center}
@media(max-width:880px){.extr .in{grid-template-columns:1fr;gap:22px}}
.bl{opacity:0;transform:translateY(14px);transition:opacity .5s ease,transform .5s cubic-bezier(.2,.7,.3,1)}
.bl.on{opacity:1;transform:none}
.prog{height:2px;background:var(--rule);position:relative}
.prog i{position:absolute;left:0;top:0;bottom:0;background:var(--acc);width:0}
.steam{opacity:0;transition:opacity .6s ease}.steam.on{opacity:1}
.wisp{animation:rise 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes rise{0%{opacity:0;transform:translateY(8px) scaleY(.55)}22%{opacity:.85}100%{opacity:0;transform:translateY(-56px) scaleY(1.2)}}
.tall{height:300vh;position:relative}
.tall .stick{position:sticky;top:38px;height:calc(100vh - 38px);display:flex;align-items:center;overflow:hidden}

/* ---------- module 2 ---------- */
.tour{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:26px;align-items:start}
@media(max-width:980px){.tour{grid-template-columns:1fr}}
.mapbox{border:1px solid var(--rule);background:var(--panel);position:relative}
.mapbox svg{width:100%;height:min(58vh,580px)}
@media(max-width:980px){.mapbox svg{height:min(52vh,460px)}}
.dep{fill:var(--mapfill);stroke:var(--maprule);stroke-width:1.2;transition:fill .4s ease}
.dep.hot{fill:color-mix(in srgb, var(--acc) 20%, var(--mapfill))}
.log{border:1px solid var(--rule);background:var(--panel);display:flex;flex-direction:column;min-height:340px}
.log h4{margin:0;padding:13px 16px;border-bottom:1px solid var(--rule);font-family:var(--fd);font-weight:var(--fdw);
  font-size:11px;letter-spacing:.16em;text-transform:uppercase}
.log ul{list-style:none;margin:0;padding:6px 0;overflow:auto;flex:1;max-height:300px}
.log li{display:grid;grid-template-columns:48px 1fr;gap:10px;padding:8px 16px;font-size:13.5px;
  opacity:0;transform:translateX(-6px);transition:opacity .35s,transform .35s}
.log li.on{opacity:1;transform:none}
.log li time{font-family:var(--fm);font-size:11px;color:var(--ink2);padding-top:3px}
.log li.alert{background:color-mix(in srgb, var(--acc) 12%, transparent)}
.log li.alert b{color:var(--acc)}
.pulse{animation:pulse 1.5s ease-out infinite}
@keyframes pulse{0%{r:6;opacity:.9}100%{r:30;opacity:0}}
.vans{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--rule)}
.vans div{padding:10px 12px;border-right:1px solid var(--rule)}
.vans div:last-child{border-right:0}
.vans b{display:block;font-family:var(--fd);font-weight:var(--fdw);font-size:13px}
.vans span{font-size:11.5px;color:var(--ink2)}

/* ---------- module 3 : configurateur ---------- */
.cfg{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:26px;align-items:start}
@media(max-width:980px){.cfg{grid-template-columns:1fr}}
.keypad{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--rule)}
.keypad button{background:var(--panel);border:0;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);
  padding:11px 4px;cursor:pointer;color:var(--ink);font-family:var(--fm);font-size:12.5px}
.keypad button:hover{background:var(--acc);color:var(--accfg)}
.keypad button[aria-pressed="true"]{background:var(--brand);color:var(--brandfg)}
.panier{border:1px solid var(--rule);background:var(--panel);padding:18px;display:flex;flex-direction:column;gap:10px;min-height:220px}
.panier ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.panier li{display:flex;justify-content:space-between;gap:10px;font-size:14.5px;border-bottom:1px solid var(--rule);padding-bottom:6px}
.panier li button{background:none;border:0;color:var(--ink2);cursor:pointer;font-size:15px;line-height:1}
.empty{color:var(--ink2);font-size:14.5px}

/* ---------- étapes devis ---------- */
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--rule);border-radius:var(--rad);overflow:hidden}
.steps button{background:none;border:0;border-right:1px solid var(--rule);padding:12px 14px;cursor:pointer;
  text-align:left;color:var(--ink2);display:flex;flex-direction:column;gap:4px}
.steps button:last-child{border-right:0}
.steps button[aria-current="true"]{background:var(--brand);color:var(--brandfg)}
.opt{display:flex;flex-direction:column;gap:7px;padding:20px;text-align:left;cursor:pointer;color:inherit;
  background:none;border:1px solid var(--rule);border-radius:var(--rad)}
.opt:hover{border-color:var(--acc)}
.opt[aria-pressed="true"]{border-color:var(--acc);background:var(--panel)}
.opt b{font-family:var(--fd);font-weight:var(--fdw);font-size:18px}
.opt span{font-size:14px;color:var(--ink2)}
.fields{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.field{display:flex;flex-direction:column;gap:6px}
.field input{background:var(--panel);border:1px solid var(--rule);border-radius:var(--rad);padding:13px 15px;
  font:inherit;font-size:16px;color:var(--ink);font-family:var(--fb)}

/* ---------- thème A : l'atelier ---------- */
[data-theme="a"]{--fd:'Syne',sans-serif;--fdw:800;--fdls:-.02em;--fdtt:uppercase;
  --fb:'Archivo',Arial,sans-serif;--fl:'Syne',sans-serif;--fm:'Syne Mono',monospace;
  --rad:0px;--chiprad:0px;--gap:0px;--cardpad:18px;--cardh:16px;--fs:16px;
  --h1:clamp(30px,3.7vw,54px);--h2:clamp(24px,2.7vw,36px);--btnfs:13px;--btnls:.1em;--btntt:uppercase}
[data-theme="a"][data-mode="jour"]{--ground:#E3E2DA;--panel:#EFEEE7;--sunk:#D6D5CC;--imgbg:#EFEEE7;--ink:#16181A;--ink2:#5A5F62;
  --rule:#B9B8AE;--brand:#123E7C;--brandfg:#F2F1EA;--acc:#B5321F;--accfg:#FFF;--btnb:#16181A;
  --cardbg:transparent;--cardbd:1px solid #B9B8AE;--mapfill:#D6D5CC;--maprule:#A9A89E;--spiral:#6E7780;--shelf:#8A9099;--glass:#C9D2DA;--metal:#2A2E31}
[data-theme="a"][data-mode="nuit"]{--ground:#0F1214;--panel:#171B1E;--sunk:#0A0D0F;--imgbg:#E9EAE6;--ink:#E7E5DC;--ink2:#9AA0A3;
  --rule:#2E3438;--brand:#12294B;--brandfg:#E7E5DC;--acc:#E0705A;--accfg:#0F1214;--btnb:#E7E5DC;
  --cardbg:transparent;--cardbd:1px solid #2E3438;--mapfill:#1F262B;--maprule:#46515A;--spiral:#7E8A92;--shelf:#39434A;--glass:#1B2429;--metal:#12161A}
[data-theme="a"] .grid3{border:1px solid var(--rule)}
[data-theme="a"] .mcard{border:0;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule)}
[data-theme="a"] .mcard h3{text-transform:uppercase;line-height:1.15}

/* ---------- thème B : la pause ---------- */
[data-theme="b"]{--fd:'Instrument Serif',Georgia,serif;--fdw:400;--fdls:-.015em;--fdtt:none;
  --fb:'Hanken Grotesk',Arial,sans-serif;--fl:'Hanken Grotesk',Arial,sans-serif;--fm:'Hanken Grotesk',Arial,sans-serif;
  --rad:4px;--chiprad:100px;--gap:20px;--cardpad:20px 22px 24px;--cardh:25px;--fs:17px;
  --h1:clamp(36px,4.6vw,66px);--h2:clamp(26px,3.2vw,44px);--btnfs:16px;--btnls:0;--btntt:none}
[data-theme="b"][data-mode="nuit"]{--ground:#13100C;--panel:#1C1712;--sunk:#0D0A07;--imgbg:#EAE4D9;--ink:#F4EFE6;--ink2:#A99C8B;
  --rule:rgba(244,239,230,.14);--brand:#1C1712;--brandfg:#F4EFE6;--acc:#E9A94A;--accfg:#13100C;--btnb:rgba(244,239,230,.3);
  --cardbg:#1C1712;--cardbd:1px solid rgba(244,239,230,.12);--mapfill:#241E18;--maprule:#514639;--spiral:#8A7C68;--shelf:#3B332A;--glass:#241E18;--metal:#0D0A07}
[data-theme="b"][data-mode="jour"]{--ground:#F6F2EA;--panel:#FFFFFF;--sunk:#EDE7DC;--imgbg:#EDE7DC;--ink:#1A150F;--ink2:#6B6154;
  --rule:rgba(26,21,15,.15);--brand:#FFFFFF;--brandfg:#1A150F;--acc:#8A5A10;--accfg:#FFFFFF;--btnb:rgba(26,21,15,.3);
  --cardbg:#FFFFFF;--cardbd:1px solid rgba(26,21,15,.12);--mapfill:#EDE7DC;--maprule:#C9BFB1;--spiral:#8A7C68;--shelf:#C9BFB1;--glass:#E5DCCC;--metal:#2A241D}
[data-theme="b"] .band{border:1px solid var(--rule)}

/* ---------- thème C : la maison ---------- */
[data-theme="c"]{--fd:'Spectral',Georgia,serif;--fdw:700;--fdls:-.012em;--fdtt:none;
  --fb:'Spectral',Georgia,serif;--fl:'Karla',Arial,sans-serif;--fm:'Karla',Arial,sans-serif;
  --rad:0px;--chiprad:0px;--gap:28px;--cardpad:16px 0 0;--cardh:22px;--fs:18px;
  --h1:clamp(34px,4.2vw,60px);--h2:clamp(26px,3vw,42px);--btnfs:14px;--btnls:.06em;--btntt:none}
[data-theme="c"][data-mode="jour"]{--ground:#FCFBF7;--panel:#F2F0E9;--sunk:#E7E4DA;--imgbg:#F2F0E9;--ink:#1C1B18;--ink2:#5F5B52;
  --rule:#DAD6CB;--brand:#24503F;--brandfg:#FCFBF7;--acc:#24503F;--accfg:#FCFBF7;--btnb:#1C1B18;
  --cardbg:transparent;--cardbd:0;--mapfill:#E7E4DA;--maprule:#BDB8AB;--spiral:#7C776C;--shelf:#BDB8AB;--glass:#DDD9CE;--metal:#2A2C27}
[data-theme="c"][data-mode="nuit"]{--ground:#191A17;--panel:#212320;--sunk:#131412;--imgbg:#212320;--ink:#EDEAE1;--ink2:#A29D92;
  --rule:#33352F;--brand:#24503F;--brandfg:#EDEAE1;--acc:#82BA9E;--accfg:#191A17;--btnb:#EDEAE1;
  --cardbg:transparent;--cardbd:0;--mapfill:#212320;--maprule:#454941;--spiral:#7C8177;--shelf:#454941;--glass:#262924;--metal:#101210}
[data-theme="c"] .mcard{border-top:1px solid var(--rule)}
[data-theme="c"] .mcard .mimg{aspect-ratio:5/4}


/* ---------- légende des tournées ---------- */
.legend{border-top:1px solid var(--rule)}
.legend>div{display:grid;grid-template-columns:12px 1fr;gap:9px;align-items:start;padding:7px 16px;border-bottom:1px solid var(--rule)}
.legend>div:last-child{border-bottom:0}
.legend i{width:10px;height:10px;border-radius:2px;display:block;margin-top:5px}
.legend b{font-family:var(--fd);font-weight:var(--fdw);font-size:13px}
.legend span{display:block;font-size:11.5px;color:var(--ink2)}
.gbtn{background:none;border:1px solid #33373C;border-radius:2px;color:#C8CCD0;padding:6px 13px;cursor:pointer;font-size:12px}
.gbtn:hover{background:#E9EDF1;color:#101113}

/* ---------- générique d'ouverture ---------- */
.intro{position:fixed;inset:0;z-index:200;background:var(--ground);color:var(--ink);font-family:var(--fb);
  display:flex;align-items:center;justify-content:center;transition:opacity .6s ease}
.intro.out{opacity:0;pointer-events:none}
.intro .skip{position:absolute;top:18px;right:22px;z-index:6;background:none;border:1px solid var(--rule);
  color:var(--ink2);padding:8px 15px;cursor:pointer;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  font-family:var(--fl);border-radius:var(--rad)}
.istage{position:relative;width:min(1180px,92vw);height:min(720px,84vh)}
.istage.dim .ipiece,.istage.dim .imach{opacity:.10 !important;transition:opacity .55s ease}
.ipiece{position:absolute;opacity:0}
.imap{left:0;top:0;width:33%}
.icards{right:0;top:6%;width:26%;display:grid;gap:12px}
.icard{background:var(--imgbg);border:1px solid var(--rule);aspect-ratio:4/3;display:flex;align-items:center;
  justify-content:center;padding:8px;opacity:0;transition:none;border-radius:var(--rad)}
.icard img{width:auto;height:100%;object-fit:contain}
.iband{left:0;bottom:4%;width:58%;background:var(--brand);color:var(--brandfg);padding:18px 24px;border-radius:var(--rad)}
.iband span{font-family:var(--fd);font-weight:var(--fdw);font-size:clamp(15px,1.9vw,26px);
  text-transform:var(--fdtt);letter-spacing:var(--fdls);line-height:1}
.imach{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);width:min(300px,24%);z-index:2}
.islogan{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;opacity:0;z-index:5;text-align:center;pointer-events:none}
.islogan span{font-family:var(--fd);font-weight:var(--fdw);letter-spacing:var(--fdls);
  font-size:clamp(28px,5.6vw,84px);line-height:1.02;text-transform:var(--fdtt);text-wrap:balance}
@media(max-width:760px){.imap,.icards,.iband{display:none}.imach{width:60%}}

@media(max-width:760px){.wrap{padding:0 20px}.hd nav{display:none}.steps{grid-template-columns:repeat(2,minmax(0,1fr))}
  .band{padding:26px}.sec{padding:44px 0}.cols{gap:30px}}
@media (prefers-reduced-motion: reduce){.wisp,.pulse{animation:none}.bl{transition:none;opacity:1;transform:none}}
</style>

<div class="testbar">
  <b>Produit final</b>
  <span>Proposition</span>
  <span class="tb" id="tbtheme">
    <button data-t="a">A · L'atelier</button><button data-t="b">B · La pause</button><button data-t="c">C · La maison</button>
  </span>
  <span class="tb" id="tbmode"><button data-m="jour">Jour</button><button data-m="nuit">Nuit</button></span>
  <button class="gbtn" id="replay">Rejouer le générique</button>
  <span class="note" id="pitch"></span>
</div>

<script>
/* ============ MODULE 2 : trois tournées distinctes + deux techniciens ============ */
const V=IDF.villes;
const TOURS=[
 {n:'1',nom:'Paris et proche banlieue',col:'#3E7BC4',pts:['Chaintreaux','Rungis','Paris','Bobigny','Nanterre']},
 {n:'2',nom:'Nemours et Fontainebleau',col:'#3E9E77',pts:['Chaintreaux','Nemours','Fontainebleau','Melun']},
 {n:'3',nom:'Montargis',col:'#C79A3B',pts:['Chaintreaux','Souppes','Château-Landon','Montargis']}
];
const TECH_COL='#D2493C';
const P1='Créteil', P2='Marne-la-Vallée';
const C1=0.38, A1=0.50, C2=0.60, A2=0.82;
const EVENTS=[
 [0.00,'07:40','Trois tournées quittent <b>Chaintreaux</b>. Deux techniciens restent au dépôt, prêts à partir.'],
 [0.10,'08:20','<b style="color:#C79A3B">Tournée 3</b> — Château-Landon, boulangerie.'],
 [0.22,'09:05','<b style="color:#3E9E77">Tournée 2</b> — Nemours, collège. Café et snacks complétés.'],
 [0.32,'09:30','<b style="color:#3E7BC4">Tournée 1</b> — Rungis, entrepôt. Monnayeur vidé.'],
 [C1,'09:41','<b>Appel</b> — Créteil : la machine ne rend plus la monnaie.',1],
 [0.41,'09:43','Simple réarmement. La tournée 1 est à 4 km : elle passe.',1],
 [A1,'09:58','Créteil réglé en douze minutes. La tournée 1 repart vers Paris.'],
 [C2,'10:20','<b>Appel</b> — Marne-la-Vallée : groupe d’infusion bloqué. Il faut une pièce.',1],
 [0.63,'10:22','Aucune tournée à dérouter : <b>le technicien 1 part du dépôt</b> avec la pièce.',1],
 [A2,'11:15','Technicien 1 sur place. Les trois tournées n’ont pas perdu une minute.'],
 [0.95,'12:00','Tournée 3 termine à Montargis. Le technicien 2 est resté disponible.']
];
function buildRoute(names){
  const pts=names.map(n=>V[n]); let L=0, seg=[];
  for(let i=1;i<pts.length;i++){const d=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);
    seg.push({a:pts[i-1],b:pts[i],d,acc:L}); L+=d;}
  return {pts,seg,L};
}
function atRoute(r,t){
  const dist=clamp(t,0,1)*r.L;
  for(const s of r.seg){ if(dist<=s.acc+s.d){const k=s.d?(dist-s.acc)/s.d:0;
    return [lerp(s.a[0],s.b[0],k),lerp(s.a[1],s.b[1],k)];}}
  return r.pts[r.pts.length-1];
}
function mountTour(host, compact){
  host.innerHTML = tourMarkup(compact);
  if(compact){ host.querySelector('.tour').style.gridTemplateColumns='minmax(0,1fr) 220px';
    host.querySelector('.log ul').style.display='none';
    host.querySelector('.log h4').textContent='En direct';
    host.querySelector('.trow').style.display='none'; }
  const svg=host.querySelector('#map');
  for(const code in IDF.deps) svg.appendChild(svgEl('path',{d:IDF.deps[code].d,class:'dep','data-code':code}));
  const LBL={'78':[250,330],'95':[330,120],'93':[470,205],'92':[326,272],'75':[397,252],'94':[452,322],'91':[380,470],'77':[700,430]};
  for(const c in LBL) svg.appendChild(svgEl('text',{x:LBL[c][0],y:LBL[c][1],'text-anchor':'middle','font-family':'Syne Mono','font-size':13,fill:'var(--ink2)'})).textContent=c;
  svg.appendChild(svgEl('text',{x:557,y:838,'text-anchor':'middle','font-family':'Syne Mono','font-size':11,fill:'var(--ink2)'})).textContent='LOIRET (45)';

  const R=TOURS.map(t=>buildRoute(t.pts));
  R.forEach((r,i)=>svg.appendChild(svgEl('path',{d:'M'+r.pts.map(p=>p.join(',')).join(' L'),fill:'none',
    stroke:TOURS[i].col,'stroke-width':2.4,'stroke-dasharray':'7 6',opacity:'.75'})));
  const detour=svgEl('path',{d:'',fill:'none',stroke:TOURS[0].col,'stroke-width':3,'stroke-dasharray':'9 6'});
  const techLine=svgEl('path',{d:'',fill:'none',stroke:TECH_COL,'stroke-width':3,'stroke-dasharray':'9 6'});
  svg.appendChild(detour); svg.appendChild(techLine);

  const seen=new Set();
  TOURS.forEach((t,i)=>t.pts.forEach(n=>{ if(seen.has(n))return; seen.add(n);
    const [x,y]=V[n];
    svg.appendChild(svgEl('rect',{x:x-4,y:y-4,width:8,height:8,fill:n==='Chaintreaux'?'var(--ink)':t.col}));
    const lab=svgEl('text',{x:x+10,y:y+4,'font-family':'Archivo','font-size':13,fill:'var(--ink)',
      'font-weight':n==='Chaintreaux'?700:400});
    lab.textContent=n==='Chaintreaux'?'Chaintreaux — dépôt':n; svg.appendChild(lab);}));

  const inc=[P1,P2].map((nom,i)=>{
    const [x,y]=V[nom];
    const halo=svgEl('circle',{cx:x,cy:y,r:6,fill:'none',stroke:TECH_COL,'stroke-width':2,opacity:0});
    const mark=svgEl('circle',{cx:x,cy:y,r:5,fill:TECH_COL,opacity:0});
    const txt=svgEl('text',{x:x+12,y:y-8,'font-family':'Archivo','font-size':13,fill:TECH_COL,'font-weight':600,opacity:0});
    txt.textContent=nom+' — panne';
    svg.appendChild(halo);svg.appendChild(mark);svg.appendChild(txt);
    return {x,y,halo,mark,txt};
  });

  const dot=(col,label)=>{const g=svgEl('g',{});
    g.appendChild(svgEl('circle',{r:12,fill:col,stroke:'var(--ground)','stroke-width':2}));
    const t=svgEl('text',{'text-anchor':'middle',y:4,'font-family':'Syne Mono','font-size':11,fill:'#FFF'});
    t.textContent=label; g.appendChild(t); svg.appendChild(g); return g;};
  const dots=TOURS.map(t=>dot(t.col,t.n));
  const techs=[dot(TECH_COL,'T1'),dot(TECH_COL,'T2')];

  const ul=host.querySelector('#logl');
  EVENTS.forEach(e=>{const li=document.createElement('li'); if(e[3]) li.className='alert';
    li.innerHTML=`<time>${e[1]}</time><span>${e[2]}</span>`; ul.appendChild(li);});
  const lis=[...ul.children];
  host.querySelector('#legend').innerHTML=
    TOURS.map(t=>`<div><i style="background:${t.col}"></i><div><b>Tournée ${t.n}</b><span>${t.nom}</span></div></div>`).join('')+
    `<div><i style="background:${TECH_COL}"></i><div><b>Techniciens</b><span>Deux, au dépôt, prêts à partir</span></div></div>`;
  const delay=host.querySelector('#delay');
  const cut1=0.55, pos1=atRoute(R[0],cut1);
  const depot=V['Chaintreaux'], mlv=V[P2], cre=V[P1];

  function frame(t){
    t=clamp(t,0,1);
    // tournée 1 : déroutage court vers Créteil
    let p1;
    if(t<C1) p1=atRoute(R[0], t/C1*cut1);
    else if(t<A1){const k=(t-C1)/(A1-C1); p1=[lerp(pos1[0],cre[0],k),lerp(pos1[1],cre[1],k)];}
    else {const k=clamp((t-A1)/(1-A1),0,1); p1=atRoute(R[0], lerp(cut1,1,k));}
    dots[0].setAttribute('transform',`translate(${p1[0]},${p1[1]})`);
    dots[1].setAttribute('transform',`translate(...)`.replace('...',atRoute(R[1],t).join(',')));
    dots[2].setAttribute('transform',`translate(...)`.replace('...',atRoute(R[2],t).join(',')));
    // techniciens
    let pt1;
    if(t<C2) pt1=[depot[0]-13,depot[1]+16];
    else if(t<A2){const k=(t-C2)/(A2-C2); pt1=[lerp(depot[0]-13,mlv[0],k),lerp(depot[1]+16,mlv[1],k)];}
    else pt1=mlv;
    techs[0].setAttribute('transform',`translate(${pt1[0]},${pt1[1]})`);
    techs[1].setAttribute('transform',`translate(${depot[0]+13},${depot[1]+16})`);
    // traces
    if(t>=C1&&t<A1+0.06){detour.setAttribute('d','M'+pos1.join(',')+' L'+cre.join(','));
      detour.setAttribute('opacity',t<A1?1:.3);} else detour.setAttribute('d','');
    if(t>=C2){techLine.setAttribute('d','M'+(depot[0]-13)+','+(depot[1]+16)+' L'+mlv.join(','));
      techLine.setAttribute('opacity',t<A2?1:.3);} else techLine.setAttribute('d','');
    // incidents
    const on1=t>=C1, on2=t>=C2;
    [[on1,t<A1],[on2,t<A2]].forEach(([sh,live],i)=>{
      inc[i].mark.setAttribute('opacity',sh?1:0); inc[i].txt.setAttribute('opacity',sh?1:0);
      inc[i].halo.setAttribute('opacity',sh&&live?1:0);
      inc[i].halo.classList.toggle('pulse',sh&&live&&!reduce);});
    host.querySelectorAll('.dep').forEach(d=>d.classList.toggle('hot',on2&&d.dataset.code==='77'));
    EVENTS.forEach((e,i)=>lis[i].classList.toggle('on',t>=e[0]));
    const u='<span style="font-size:14px;font-family:var(--fb);font-weight:400;color:var(--ink2)">';
    if(t>=A2) delay.innerHTML='12 min'+u+' et 55 min — deux pannes réglées</span>';
    else if(t>=C2) delay.innerHTML=Math.round(20+(t-C2)/(A2-C2)*35)+' min'+u+' technicien en route</span>';
    else if(t>=A1) delay.innerHTML='12 min'+u+' Créteil réglé</span>';
    else if(t>=C1) delay.innerHTML=Math.round((t-C1)/(A1-C1)*12)+' min'+u+' tournée 1 en approche</span>';
    else delay.textContent='—';
  }
  let t=0, playing=!reduce, last=0, alive=true;
  const scrub=host.querySelector('#tscrub');
  (function loop(ts){ if(!alive) return;
    if(playing){const dt=last?(ts-last)/1000:0; last=ts; t+=dt/34; if(t>1){t=1;playing=false;} scrub.value=t*1000; frame(t);}
    else last=ts; requestAnimationFrame(loop);})(0);
  MOUNT_CLEAN.push(()=>{alive=false;});
  scrub.addEventListener('input',()=>{playing=false; t=scrub.value/1000; frame(t);});
  host.querySelector('#tplay').addEventListener('click',()=>{t=0;playing=true;last=0;});
  host.querySelector('#tpause').addEventListener('click',()=>{playing=!playing;last=0;});
  frame(0);
}

  document.body.appendChild(ov);

    g.appendChild(p); const L=p.getTotalLength();
    p.setAttribute('stroke-dasharray',L); p.setAttribute('stroke-dashoffset',L); paths.push({p,L});
  }
  const tps=TOURS.map(t=>{const r=buildRoute(t.pts);
    const p=svgEl('path',{d:'M'+r.pts.map(q=>q.join(',')).join(' L'),fill:'none',stroke:t.col,'stroke-width':4,'stroke-linecap':'round'});
    tg.appendChild(p); const L=p.getTotalLength();

  ov.querySelector('#skip').addEventListener('click',end);

    ov.querySelector('.icards').style.opacity=cp>0?1:0;

    const bp=clamp((k-0.58)/0.14,0,1);
    iband.style.opacity=bp; iband.style.transform=`translateY(${(1-bp)*18}px)`;
    const sp=clamp((k-0.74)/0.16,0,1);
    if(sp>0){ ov.querySelector('.istage').classList.add('dim');
      slog.style.opacity=sp; slog.style.transform=`translateY(${(1-sp)*24}px)`; }
    if(k<1) requestAnimationFrame(step); else setTimeout(end,600);
  }
  requestAnimationFrame(step);
}

<script>
/* ============ MODULE 1 : extraction ============ */
function mountExtraction(host, opts){
  host.innerHTML = extractionMarkup();
  const q=s=>host.querySelector(s);
  const beansG=q('#beans'), BEANS=[];
  for(let i=0;i<16;i++){
    const el=document.createElementNS(NS,'ellipse'); const x=162+Math.random()*116;
    el.setAttribute('rx',5.2); el.setAttribute('ry',3.6); el.setAttribute('fill','#5A3A22');
    beansG.appendChild(el); BEANS.push({el,x,d:Math.random(),spin:Math.random()*360});
  }
  const jet=q('#jetrect'),fill=q('#fill'),crema=q('#crema'),steam=q('#steam'),grinder=q('#grinder'),
        screen=q('#screen'),pct=q('#pct'),pbar=q('#pbar'),state=q('#mstate');
  const blocks=['#b1','#b2','#b3','#b4'].map(q), AT=[0.10,0.34,0.58,0.84];
  function draw(p){
    p=clamp(p,0,1);
    const bp=clamp(p/0.28,0,1);
    BEANS.forEach(b=>{const t=clamp((bp-b.d*0.55)/0.45,0,1); const y=lerp(-40,64,t);
      b.el.setAttribute('cx',b.x); b.el.setAttribute('cy',y);
      b.el.setAttribute('opacity',t<=0?0:.9);
      b.el.setAttribute('transform',`rotate(${b.spin+t*220} ${b.x} ${y})`);});
    screen.setAttribute('opacity',clamp((p-0.06)/0.08,0,1));
    grinder.setAttribute('transform',`rotate(${clamp((p-0.24)/0.20,0,1)*900} 220 246)`);
    const jp=clamp((p-0.44)/0.36,0,1);
    jet.setAttribute('height', jp>0&&jp<1?68:0);
    jet.setAttribute('width', jp>0&&jp<1?7+Math.sin(p*220)*1.6:0);
    const lvl=jp*56;
    fill.setAttribute('y',434-lvl); fill.setAttribute('height',lvl);
    const cr=jp>0.15?clamp((jp-0.15)/0.5,0,1)*7:0;
    crema.setAttribute('y',434-lvl); crema.setAttribute('height',cr);
    steam.classList.toggle('on',p>0.62);
    pct.textContent=Math.round(p*100)+' %'; pbar.style.width=(p*100)+'%';
    blocks.forEach((b,i)=>b.classList.toggle('on',p>=AT[i]));
  }
  let auto=false;
  const sec=opts.scrollHost;
  function onScroll(){
    if(auto||!sec) return;
    const r=sec.getBoundingClientRect(), total=sec.offsetHeight-window.innerHeight;
    draw(total>0?(-r.top)/total:0);
  }
  function play(){
    if(auto) return; auto=true; state.textContent='Lecture…';
    const t0=performance.now(), D=reduce?1:5200;
    (function run(ts){const k=clamp((ts-t0)/D,0,1);
      draw(k<0.5?k*k*2:1-Math.pow(-2*k+2,2)/2);
      if(k<1) requestAnimationFrame(run);
      else{auto=false; state.textContent=sec?'Pilotée au défilement':'Terminée'; onScroll();}
    })(t0);
  }
  q('#autoplay').addEventListener('click',play);
  let tick=false;
  function onScrollThrottled(){ if(!tick){tick=true;requestAnimationFrame(()=>{onScroll();tick=false;});} }
  if(sec){ window.addEventListener('scroll',onScrollThrottled,{passive:true}); onScroll();
    MOUNT_CLEAN.push(()=>window.removeEventListener('scroll',onScrollThrottled)); }
  else { state.textContent='Se joue à l’arrivée'; draw(0);
    const io=new IntersectionObserver(es=>{ if(es[0].isIntersecting){ io.disconnect(); play(); } },{threshold:.4});
    io.observe(host); MOUNT_CLEAN.push(()=>io.disconnect()); }
  if(opts.autoplay) setTimeout(play, 500);
}

/* ============ MODULE 3 : configurateur ============ */
function mountCfg(host){
  host.innerHTML=cfgMarkup();
  const svg=host.querySelector('#vend');
  svg.appendChild(svgEl('rect',{x:8,y:8,width:604,height:504,fill:'var(--metal)'}));
  svg.appendChild(svgEl('rect',{x:26,y:26,width:420,height:392,fill:'var(--glass)',stroke:'var(--shelf)'}));
  const items={};
  ['A','B','C'].forEach((r,ri)=>{
    const y=62+ri*120;
    svg.appendChild(svgEl('line',{x1:34,y1:y+56,x2:438,y2:y+56,stroke:'var(--shelf)','stroke-width':2}));
    [1,2,3,4].forEach((c,ci)=>{
      const x=46+ci*99;
      let d='M'+x+' '+(y+45); for(let k=0;k<5;k++) d+=` q8.5 ${k%2?-13:13} 17 0`;
      const sp=svgEl('path',{d,fill:'none',stroke:'var(--spiral)','stroke-width':3.4,'stroke-linecap':'round','stroke-dasharray':'11 7'});
      svg.appendChild(sp);
      const it=svgEl('rect',{x:x+4,y:y+8,width:56,height:34,rx:2,fill:'var(--acc)',opacity:.92});
      svg.appendChild(it);
      const lab=svgEl('text',{x:x+32,y:y+30,'text-anchor':'middle','font-family':'Syne Mono','font-size':11,fill:'#FFF'});
      lab.textContent=r+c; svg.appendChild(lab);
      items[r+c]={sp,it,lab,x,y};
    });
  });
  svg.appendChild(svgEl('rect',{x:26,y:432,width:420,height:60,fill:'var(--metal)',stroke:'var(--shelf)'}));
  svg.appendChild(svgEl('text',{x:36,y:468,'font-family':'Syne Mono','font-size':12,fill:'var(--ink2)'})).textContent='BAC DE LIVRAISON';
  svg.appendChild(svgEl('rect',{x:466,y:26,width:128,height:160,fill:'var(--metal)',stroke:'var(--shelf)'}));
  const disp=svgEl('text',{x:530,y:118,'text-anchor':'middle','font-family':'Syne Mono','font-size':28,fill:'var(--acc)'});
  disp.textContent='--'; svg.appendChild(disp);
  svg.appendChild(svgEl('text',{x:530,y:58,'text-anchor':'middle','font-family':'Syne Mono','font-size':11,fill:'var(--ink2)'})).textContent='SÉLECTION';
  svg.appendChild(svgEl('rect',{x:466,y:206,width:128,height:212,fill:'var(--metal)',stroke:'var(--shelf)'}));
  const cnt=svgEl('text',{x:530,y:300,'text-anchor':'middle','font-family':'Syne Mono','font-size':30,fill:'var(--ink2)'});
  svg.appendChild(svgEl('text',{x:530,y:250,'text-anchor':'middle','font-family':'Syne Mono','font-size':11,fill:'var(--ink2)'})).textContent='DANS VOTRE POSTE';
  svg.appendChild(cnt);

  const pad=host.querySelector('#pad');
  CODES.forEach(c=>{const b=document.createElement('button'); b.textContent=c; b.dataset.code=c; pad.appendChild(b);});
  const panier=host.querySelector('#panier');
  function refresh(){
    cnt.textContent=String(S.panier.length).padStart(2,'0');
    pad.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(S.panier.includes(b.dataset.code))));
    panier.innerHTML = S.panier.length
      ? `<div class="lab">Votre poste — ${S.panier.length} référence${S.panier.length>1?'s':''}</div>
         <ul>${S.panier.map(c=>`<li><span><b>${PRODUITS[c][0]}</b><br><span style="font-size:13px;color:var(--ink2)">${PRODUITS[c][1]}</span></span>
           <button data-act="del" data-v="${c}" title="Retirer">✕</button></li>`).join('')}</ul>
         <span style="margin-top:auto;font-size:13.5px;color:var(--ink2)">Rien n’est facturé : c’est ce que vos équipes trouveront dedans.</span>`
      : `<span class="empty">Le poste est vide. Tapez un code pour y mettre quelque chose.</span>`;
  }
  let busy=false;
  function dispense(code){
    if(busy) return;
    if(S.panier.includes(code)){ S.panier=S.panier.filter(x=>x!==code); refresh(); return; }
    busy=true; disp.textContent=code;
    const {sp,it,lab,y}=items[code]; const y0=+it.getAttribute('y'); const D=reduce?0:850; let t0=null;
    (function step(ts){
      if(!t0) t0=ts; const k=D?clamp((ts-t0)/D,0,1):1;
      sp.setAttribute('stroke-dashoffset',-k*140);
      const fall=k<0.45?0:(k-0.45)/0.55, yy=y0+fall*fall*(444-y0);
      it.setAttribute('y',yy); lab.setAttribute('y',yy+22);
      it.setAttribute('opacity',fall>0.9?0:.92); lab.setAttribute('opacity',fall>0.9?0:1);
      if(k<1) requestAnimationFrame(step);
      else{ S.panier.push(code); refresh();
        setTimeout(()=>{it.setAttribute('y',y0);lab.setAttribute('y',y0+22);
          it.setAttribute('opacity',.92);lab.setAttribute('opacity',1);busy=false;},450);}
    })(0);
  }
  pad.addEventListener('click',e=>{const b=e.target.closest('button'); if(b) dispense(b.dataset.code);});
  panier.addEventListener('click',e=>{const b=e.target.closest('[data-act="del"]'); if(b){S.panier=S.panier.filter(x=>x!==b.dataset.v); refresh();}});
  refresh();
}

/* ============ routeur ============ */
let MOUNT_CLEAN=[];
function route(){
  const h=(location.hash||'#/').slice(2);
  if(h.startsWith('machines/')) return {p:fiche(h.split('/')[1]),n:'#/machines'};
  if(h==='machines') return {p:machinesPage(),n:'#/machines'};
  if(h==='depot-gratuit') return {p:depot(),n:'#/depot-gratuit'};
  if(h==='tournee') return {p:tourneePage(),n:'#/tournee'};
  if(h==='devis') return {p:devis(),n:'#/devis'};
  if(h==='contact') return {p:contact(),n:'#/contact'};
  return {p:home(),n:'#/'};
}
let firstHome=true;
function render(){
  MOUNT_CLEAN.forEach(f=>f()); MOUNT_CLEAN=[];
  const r=route();
  document.getElementById('app').innerHTML=
    `<div class="site" data-theme="${S.theme}" data-mode="${S.mode}"><div class="wrap">${head(r.n)}</div>
     <div class="wrap">${r.p}</div><div class="wrap">${foot()}</div></div>`;
  document.querySelectorAll('[data-mount]').forEach(el=>{
    const k=el.dataset.mount;
    if(k==='extraction'){
      const tall=el.closest('.tall');
      mountExtraction(el,{scrollHost:tall,autoplay: S.theme==='b' && firstHome && r.n==='#/'});
      if(S.theme==='b') firstHome=false;
    }
    else if(k==='tour') mountTour(el,false);
    else if(k==='tour-compact') mountTour(el,true);
    else if(k==='cfg') mountCfg(el);
  });
  document.querySelectorAll('#tbtheme button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.t===S.theme));
  document.querySelectorAll('#tbmode button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.m===S.mode));
  document.getElementById('pitch').textContent=PITCH[S.theme];
}
document.getElementById('tbtheme').addEventListener('click',e=>{const b=e.target.closest('button'); if(!b)return;
  S.theme=b.dataset.t; S.mode=DEF_MODE[S.theme]; firstHome=true; render(); scrollTo({top:0});
  if((location.hash||'#/')==='#/') playIntro();});
document.getElementById('tbmode').addEventListener('click',e=>{const b=e.target.closest('button'); if(!b)return;
  S.mode=b.dataset.m; render();});
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  const a=b.dataset.act,v=b.dataset.v;
  if(a==='lieu'){S.lieu=v;S.step=2;}
  else if(a==='taille'){S.taille=v;S.step=3;}
  else if(a==='envie'){S.envies=S.envies.includes(v)?S.envies.filter(x=>x!==v):S.envies.concat([v]);}
  else if(a==='step'){S.step=Number(v);}
  else if(a==='envoi'){alert('Maquette : la demande n’est pas envoyée.\n\n'+recap()); return;}
  else return;
  render(); scrollTo({top:0});
});
function fitBar(){document.documentElement.style.setProperty('--tbh',

addEventListener('load',fitBar); setTimeout(fitBar,400); setTimeout(fitBar,1500);
